name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon, building the Intel app too: packaging for another
    # architecture only downloads that architecture's Electron, and macOS
    # minutes are the expensive kind.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Package for Apple Silicon
        run: pnpm package:desktop --arch arm64 --version "${GITHUB_REF_NAME#v}"

      - name: Package for Intel
        run: pnpm package:desktop --arch x64 --version "${GITHUB_REF_NAME#v}"

      # The installer attached to a release installs that release, rather than
      # whatever is latest: GitHub's "latest" skips pre-releases, so without
      # this a beta could not be installed.
      - name: Point the installer at this release
        run: |
          sed -i '' "s/^release_tag=$/release_tag=$GITHUB_REF_NAME/" apps/desktop/install/install.sh
          grep -q "^release_tag=$GITHUB_REF_NAME$" apps/desktop/install/install.sh

      # The install scripts go with the release, so each is the one that matches
      # what it installs. A version with a suffix, such as v0.2.0-beta.1, is
      # published as a pre-release: visible, installable from its own URL, and
      # never what "latest" points at.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --generate-notes \
            apps/desktop/out/yart-darwin-arm64.zip \
            apps/desktop/out/yart-darwin-arm64.zip.sha256 \
            apps/desktop/out/yart-darwin-x64.zip \
            apps/desktop/out/yart-darwin-x64.zip.sha256 \
            apps/desktop/install/install.sh \
            apps/desktop/install/uninstall.sh
