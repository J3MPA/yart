name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon, which also builds the Intel app. A package for a different
    # architecture only downloads the Electron of that architecture. macOS
    # minutes cost the most.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Package for Apple Silicon
        run: pnpm package:desktop --arch arm64 --version "${GITHUB_REF_NAME#v}"

      - name: Package for Intel
        run: pnpm package:desktop --arch x64 --version "${GITHUB_REF_NAME#v}"

      # The installer of a release installs that release, not the latest release.
      # "latest" on GitHub ignores pre-releases. Without this step, you could not
      # install a beta.
      - name: Point the installer at this release
        run: |
          sed -i '' "s/^release_tag=$/release_tag=$GITHUB_REF_NAME/" apps/desktop/install/install.sh
          grep -q "^release_tag=$GITHUB_REF_NAME$" apps/desktop/install/install.sh

      # The install scripts go with the release. Thus each script matches what it
      # installs. A version with a suffix, such as v0.2.0-beta.1, becomes a
      # pre-release. People can see it and install it from its own URL, but
      # "latest" never points to it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --generate-notes \
            apps/desktop/out/yart-darwin-arm64.zip \
            apps/desktop/out/yart-darwin-arm64.zip.sha256 \
            apps/desktop/out/yart-darwin-x64.zip \
            apps/desktop/out/yart-darwin-x64.zip.sha256 \
            apps/desktop/install/install.sh \
            apps/desktop/install/uninstall.sh
